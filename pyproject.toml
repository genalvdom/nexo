[project]
name = "graphrag-stack"
version = "0.1.0"
description = "Graph RAG investigation stack: LangGraph orchestration, Strands micro-agent, vLLM, Neo4j"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "strands-agents[openai]>=1.61,<2",
    "neo4j>=6.4,<7",
    "openai>=2.50,<3",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "tenacity>=9.2,<10",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary,pool]>=3.2,<4"]
dev = ["pytest>=8"]

[project.scripts]
graphrag = "graphrag_stack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
